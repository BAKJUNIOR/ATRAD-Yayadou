<app-auth-page-layout>
  <div class="flex w-full max-w-[460px] animate-enter flex-col gap-5">
    <section class="flex flex-col gap-7" aria-labelledby="forgot-title">
      <header class="flex flex-col gap-1.5">
        <h1 id="forgot-title" class="text-[24px] font-semibold tracking-[-0.015em] text-ink">
          Mot de passe oublié
        </h1>
        <p class="text-[13.5px] text-ink-muted">
          Saisissez votre matricule et votre adresse e-mail professionnelle : vous recevrez un lien
          pour choisir un nouveau mot de passe.
        </p>
      </header>

      @if (success.text()) {
        <div
          role="status"
          class="flex animate-enter items-start gap-3 rounded-control border border-success-line bg-success-bg px-3.5 py-3 text-[13px] leading-normal text-success"
        >
          <app-icon name="check-circle" [size]="17" class="mt-px flex-none" />
          <span>{{ success.text() }}</span>
        </div>
      }
      <form class="flex flex-col gap-4" novalidate (submit)="submit($event)">
        <div class="flex flex-col gap-1.5">
          <label for="forgot-matricule" class="text-[12.5px] font-medium text-ink-secondary">
            Matricule
          </label>
          <div class="relative">
            <app-icon
              name="user"
              [size]="17"
              class="pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-ink-faint"
            />
            <input
              id="forgot-matricule"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              placeholder="Votre matricule"
              class="h-11 w-full rounded-control border border-line-strong bg-card ps-10 pe-3 text-[14px] text-ink outline-none transition-shadow placeholder:text-ink-faint focus:border-brand focus:ring-3 focus:ring-brand/16"
              [formField]="requestForm.matricule"
              [attr.aria-invalid]="error.text() ? true : null"
              [attr.aria-describedby]="error.text() ? 'forgot-error' : null"
            />
          </div>
        </div>

        <div class="flex flex-col gap-1.5">
          <label for="forgot-email" class="text-[12.5px] font-medium text-ink-secondary">
            Adresse e-mail professionnelle
          </label>
          <div class="relative">
            <app-icon
              name="mail"
              [size]="17"
              class="pointer-events-none absolute start-3.5 top-1/2 -translate-y-1/2 text-ink-faint"
            />
            <input
              id="forgot-email"
              type="email"
              autocomplete="email"
              spellcheck="false"
              placeholder="prenom.nom@entreprise.com"
              class="h-11 w-full rounded-control border border-line-strong bg-card ps-10 pe-3 text-[14px] text-ink outline-none transition-shadow placeholder:text-ink-faint focus:border-brand focus:ring-3 focus:ring-brand/16"
              [formField]="requestForm.email"
              [attr.aria-invalid]="error.text() ? true : null"
              [attr.aria-describedby]="error.text() ? 'forgot-error' : null"
            />
          </div>
        </div>

        @if (error.text()) {
          <p
            id="forgot-error"
            role="alert"
            class="flex animate-enter items-start gap-2.5 rounded-control border border-danger-line bg-danger-bg px-3 py-2.5 text-[12.5px] leading-[1.45] text-danger"
          >
            <app-icon name="alert" [size]="16" class="mt-px" />
            <span>{{ error.text() }}</span>
          </p>
        }

        <button
          appButton
          type="submit"
          class="mt-1 h-11 text-[14px] font-semibold disabled:cursor-wait disabled:opacity-75"
          [disabled]="pending()"
          [attr.aria-busy]="pending()"
        >
          @if (pending()) {
            <span
              class="size-4 animate-spin rounded-full border-2 border-white/40 border-t-white"
              aria-hidden="true"
            ></span>
            Envoi…
          } @else {
            Recevoir le lien
            <app-icon name="send" [size]="16" />
          }
        </button>
      </form>
    </section>

    <a
      routerLink="/signin"
      class="mx-auto flex items-center gap-1.5 text-[13px] font-medium text-brand-ink hover:underline"
    >
      <app-icon name="arrow-left" [size]="14" />
      Retour à la connexion
    </a>
  </div>
</app-auth-page-layout>
