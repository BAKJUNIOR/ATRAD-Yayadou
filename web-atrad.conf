server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    server_tokens off;
    root /usr/share/nginx/html;

    # Pièces jointes : jusqu'à 55 Mo par requête (spring.servlet.multipart.max-request-size).
    client_max_body_size 55m;

    # API et WebSocket servis sur la même origine que le front (config/app-config.json garde
    # "apiBaseUrl": "") : pas de CORS ni de second domaine. Le DNS de Docker est relu à chaque
    # requête : nginx démarre même si atrad-back n'est pas encore lancé, et suit son
    # changement d'adresse quand il est recréé.
    resolver 127.0.0.11 valid=10s;
    set $atrad_back atrad-back:8080;

    location /api/ {
        proxy_pass http://$atrad_back;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://$atrad_back;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Une connexion temps réel peut rester longtemps sans message.
        proxy_read_timeout 1h;
    }

    # Adresse de l'API lue au démarrage : même URL à chaque déploiement, jamais en cache.
    location = /config/app-config.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }
}
