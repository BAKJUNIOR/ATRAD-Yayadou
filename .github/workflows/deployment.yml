name: deploy atrad front
on:
  push:
    branches:
      - develop # ne se déclenche QUE quand on push sur develop
env:
  IMAGE: atrad-front
  VERSION: 1.0.0
  DOSSIER: /opt/application/atrad/atrad-front
  DOCKERHUB_USER: bakjunior58
jobs:
  create-folder:
    name: create folder
    runs-on: ubuntu-latest
    steps:
      - name: execute commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            mkdir -p ${{env.DOSSIER}}
            ls -al /opt/application/atrad

  generate-image:
    name: generate image
    runs-on: ubuntu-latest
    needs: ['create-folder']
    steps:
      - name: cloner le repertoire
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{env.DOCKERHUB_USER}}/${{env.IMAGE}}:${{env.VERSION}}

  run-container:
    name: run container
    runs-on: ubuntu-latest
    needs: [ 'create-folder', 'generate-image']
    steps:
      - name: cloner le repertoire
        uses: actions/checkout@v4
      - name: copy file via ssh key
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          source: "compose.yaml"
          target: ${{env.DOSSIER}}
      - name: execute commands to run container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: 22
          script: |
            # Réseau partagé avec le backend (créé par son déploiement, ou ici s'il n'est pas encore passé).
            docker network inspect atrad-network >/dev/null 2>&1 || docker network create atrad-network
            docker compose -f ${{env.DOSSIER}}/compose.yaml pull
            docker compose -f ${{env.DOSSIER}}/compose.yaml up -d --force-recreate
